name: CI R1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: R1 quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable CI credentials, unrelated to the developer's database.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truck_parts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d truck_parts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/truck_parts_test
      VITE_USE_MOCK_API: 'true'

    steps:
      - name: Check out the pull request merge revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm with workspace override fixes
        run: npm --ignore-scripts install --global npm@11.19.1

      - name: Install locked dependencies
        run: npm --ignore-scripts ci 

      - name: Generate Prisma Client
        run: npm exec --ignore-scripts --workspace @truck-parts/api -- prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck application and API tests
        run: npm run typecheck

      - name: Typecheck web tests
        run: npm run typecheck:test --workspace @truck-parts/web

      - name: Unit tests
        run: npm run test:unit

      - name: Clean migrations and integration tests
        run: npm run test:integration

      - name: Web component tests
        run: npm run test:web:component

      - name: Build API and web
        run: npm run build
        env:
          # Build the actual Release 1 HTTP surface; tests keep their isolated mock baseline.
          VITE_USE_MOCK_API: 'false'

      - name: Audit dependencies
        run: npm audit --audit-level=high
