map $server_port $candidate_client_ip {
    # Port 8080 is reachable only by cloudflared on the internal Docker network.
    8080 $http_cf_connecting_ip;
    default $remote_addr;
}

map $candidate_client_ip $client_ip {
    # Preserve availability if the tunnel omits CF-Connecting-IP unexpectedly.
    "" $remote_addr;
    default $candidate_client_ip;
}

server {
    # Port 8081 is the host-published local-development entry point (unprivileged).
    listen 8081;
    # Port 8080 is the separate internal entry point for cloudflared.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        # Replace, rather than append, untrusted forwarding headers.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

