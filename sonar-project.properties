sonar.projectKey=Solo-Camiones_solocamiones
sonar.organization=solo-camiones


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=solocamiones
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=apps/api/src,apps/web/src

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8


sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/*.test.ts,\
**/*.test.tsx,\
**/*.spec.ts,\
**/*.spec.tsx

# Test setup is intentionally local to each behavior suite, and applied Prisma
# migrations are immutable. Neither should drive production-code CPD decisions.
sonar.cpd.exclusions=\
**/tests/**,\
**/prisma/migrations/**


sonar.javascript.lcov.reportPaths=\
apps/api/coverage/unit/lcov.info,\
apps/api/coverage/integration/lcov.info,\
apps/web/coverage/lcov.info
