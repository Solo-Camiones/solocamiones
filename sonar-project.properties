sonar.projectKey=ManyVargas_solocamiones
sonar.organization=solocamiones


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=solocamiones
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=apps/api/src,apps/web/src

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8


sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/*.test.ts,\
**/*.test.tsx,\
**/*.spec.ts,\
**/*.spec.tsx


sonar.javascript.lcov.reportPaths=\
apps/api/coverage/unit/lcov.info,\
apps/api/coverage/integration/lcov.info,\
apps/web/coverage/lcov.info