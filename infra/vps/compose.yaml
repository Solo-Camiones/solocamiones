# Generic VPS stack for staging and production.
# Secrets and environment-specific values come from an external env file, e.g.:
#   docker compose --env-file /etc/solocamiones/staging.env -f infra/vps/compose.yaml up -d
#
# Scope M2 critical path: edge, web, api, db, migrate.
# M3 adds: bootstrap-db, backup, verify-restore, assistant-purge (+ systemd timers).
# M4 adds: postgres-exporter (always), node-exporter (profile host-metrics),
#          prometheus/grafana (profile observability), vector (profile logs).
#
# Images must be digests in real deploys (set API_IMAGE / WEB_IMAGE).
# Optional build contexts below are for exceptional local image builds only.
#
# Role bootstrap order on a new volume:
#   1) up db
#   2) --profile operations run --rm bootstrap-db
#   3) --profile operations run --rm migrate   (DATABASE_MIGRATION_URL = migration role)
#   4) --profile operations run --rm bootstrap-db   (refresh grants on new tables)
#   5) up api/web/edge                         (DATABASE_URL = runtime role)

name: ${COMPOSE_PROJECT_NAME:-solocamiones}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ${ORIGIN_TLS_CERT:?ORIGIN_TLS_CERT is required}:/etc/nginx/certs/origin.pem:ro
      - ${ORIGIN_TLS_KEY:?ORIGIN_TLS_KEY is required}:/etc/nginx/certs/origin.key:ro
      - ${ORIGIN_CLIENT_CA:?ORIGIN_CLIENT_CA is required}:/etc/nginx/certs/authenticated_origin_pull_ca.pem:ro
    # Drop image default site so only the envsubst-rendered app.conf is active.
    command:
      [
        '/bin/sh',
        '-c',
        "rm -f /etc/nginx/conf.d/default.conf && /docker-entrypoint.sh nginx -g 'daemon off;'",
      ]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
      - application
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-solocamiones-web:local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_USE_MOCK_API: 'false'
        VITE_CAPABILITIES_PRESET: release-2
        VITE_ENABLE_DEMO_CONTROLS: 'false'
    restart: unless-stopped
    expose:
      - '8081'
    networks:
      - application
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8081/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  api:
    image: ${API_IMAGE:-solocamiones-api:local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_RELEASE: ${APP_RELEASE:?APP_RELEASE is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?INITIAL_PASSWORD is required}
      TRUST_PROXY: '1'
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?CF_ACCESS_TEAM_DOMAIN is required}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?CF_ACCESS_AUD is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      OPENAI_VECTOR_STORE_ID: ${OPENAI_VECTOR_STORE_ID:-}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
      ASSISTANT_DAILY_MESSAGE_LIMIT: ${ASSISTANT_DAILY_MESSAGE_LIMIT:-50}
      ASSISTANT_GLOBAL_DAILY_MESSAGE_LIMIT: ${ASSISTANT_GLOBAL_DAILY_MESSAGE_LIMIT:-100}
      ASSISTANT_MAX_INPUT_CHARS: ${ASSISTANT_MAX_INPUT_CHARS:-2000}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-1200}
      ASSISTANT_MAX_TOOL_CALLS: ${ASSISTANT_MAX_TOOL_CALLS:-3}
      ASSISTANT_MAX_RETRIEVAL_RESULTS: ${ASSISTANT_MAX_RETRIEVAL_RESULTS:-6}
      ASSISTANT_RETRIEVAL_SCORE_THRESHOLD: ${ASSISTANT_RETRIEVAL_SCORE_THRESHOLD:-0.55}
      ASSISTANT_REQUEST_TIMEOUT_MS: ${ASSISTANT_REQUEST_TIMEOUT_MS:-45000}
    expose:
      - '3000'
    # Optional host publish for Tailscale scrape of GET /metrics (production → staging Prometheus).
    # Default binds loopback only. Set METRICS_SCRAPE_BIND to the Tailscale IP on production; never 0.0.0.0.
    ports:
      - '${METRICS_SCRAPE_BIND:-127.0.0.1}:3000:3000'
    networks:
      - application
      - database
      - monitoring
    depends_on:
      db:
        condition: service_healthy
    # HTTP /api/health/* requires Cloudflare Access JWT in staging/production (M1).
    # Container probes therefore only check that the process accepts TCP on PORT.
    # External readiness: Better Stack via Cloudflare Access service token (M4.3 / M6).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').createConnection({port:3000,host:'127.0.0.1'},function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # Operational one-shot. Never restart automatically.
  # docker compose --env-file ... --profile operations run --rm migrate
  migrate:
    image: ${API_IMAGE:-solocamiones-api:local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles: ['operations']
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
    command: ['npm', 'run', 'db:migrate:deploy:runtime', '-w', '@solocamiones/api']
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # Idempotent role bootstrap (migration/runtime/backup/monitoring). M3.1.
  # docker compose --env-file ... --profile operations run --rm bootstrap-db
  bootstrap-db:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${BACKUP_IMAGE:-solocamiones-backup:local}
    profiles: ['operations']
    restart: 'no'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_SUPERUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ROLE_MIGRATION_NAME: ${ROLE_MIGRATION_NAME:-migration}
      ROLE_RUNTIME_NAME: ${ROLE_RUNTIME_NAME:-runtime}
      ROLE_BACKUP_NAME: ${ROLE_BACKUP_NAME:-backup}
      ROLE_MONITORING_NAME: ${ROLE_MONITORING_NAME:-monitoring}
      ROLE_MIGRATION_PASSWORD: ${ROLE_MIGRATION_PASSWORD:?ROLE_MIGRATION_PASSWORD is required}
      ROLE_RUNTIME_PASSWORD: ${ROLE_RUNTIME_PASSWORD:?ROLE_RUNTIME_PASSWORD is required}
      ROLE_BACKUP_PASSWORD: ${ROLE_BACKUP_PASSWORD:?ROLE_BACKUP_PASSWORD is required}
      ROLE_MONITORING_PASSWORD: ${ROLE_MONITORING_PASSWORD:?ROLE_MONITORING_PASSWORD is required}
      BOOTSTRAP_REASSIGN_FROM: ${BOOTSTRAP_REASSIGN_FROM:-}
    volumes:
      - ../../scripts/deployment/bootstrap-postgres.sh:/scripts/bootstrap-postgres.sh:ro
    entrypoint: ['/bin/bash', '/scripts/bootstrap-postgres.sh']
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # Negative permission checks for DB roles. M3.1.
  # docker compose --env-file ... --profile operations run --rm test-db-roles
  test-db-roles:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${BACKUP_IMAGE:-solocamiones-backup:local}
    profiles: ['operations']
    restart: 'no'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      ROLE_RUNTIME_NAME: ${ROLE_RUNTIME_NAME:-runtime}
      ROLE_BACKUP_NAME: ${ROLE_BACKUP_NAME:-backup}
      ROLE_MONITORING_NAME: ${ROLE_MONITORING_NAME:-monitoring}
      ROLE_RUNTIME_PASSWORD: ${ROLE_RUNTIME_PASSWORD:?ROLE_RUNTIME_PASSWORD is required}
      ROLE_BACKUP_PASSWORD: ${ROLE_BACKUP_PASSWORD:?ROLE_BACKUP_PASSWORD is required}
      ROLE_MONITORING_PASSWORD: ${ROLE_MONITORING_PASSWORD:?ROLE_MONITORING_PASSWORD is required}
    volumes:
      - ../../scripts/deployment/test-postgres-roles.sh:/scripts/test-postgres-roles.sh:ro
    entrypoint: ['/bin/bash', '/scripts/test-postgres-roles.sh']
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # Encrypted pg_dump → R2. Needs database + non-internal network for R2 egress. M3.2.
  # docker compose --env-file ... --profile operations run --rm backup
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${BACKUP_IMAGE:-solocamiones-backup:local}
    profiles: ['operations']
    restart: 'no'
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_RELEASE: ${APP_RELEASE:-unknown}
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL is required}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}
      BACKUP_TZ: ${BACKUP_TZ:-America/Santo_Domingo}
      BACKUP_RETENTION_HOURLY_HOURS: ${BACKUP_RETENTION_HOURLY_HOURS:-48}
      BACKUP_RETENTION_DAILY_DAYS: ${BACKUP_RETENTION_DAILY_DAYS:-30}
      BACKUP_RETENTION_MONTHLY_MONTHS: ${BACKUP_RETENTION_MONTHLY_MONTHS:-12}
      BACKUP_METRICS_DIR: /var/lib/node_exporter/textfile
    volumes:
      - ../../scripts/deployment/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - backup-tmp:/tmp/solocamiones-backup
      - backup-metrics:/var/lib/node_exporter/textfile
    entrypoint: ['/bin/bash', '/scripts/backup-postgres.sh']
    networks:
      - database
      - application
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # PostgreSQL metrics with monitoring role (M3.1 / M4.2). Not publicly published.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${ROLE_MONITORING_NAME:-monitoring}:${ROLE_MONITORING_PASSWORD:?ROLE_MONITORING_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
    ports:
      - '${EXPORTER_BIND:-127.0.0.1}:9187:9187'
    networks:
      - monitoring
      - database
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # Host metrics + backup textfile collector. Linux VPS only (bind-mounts /proc /sys).
  # docker compose --profile host-metrics up -d node-exporter
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ['host-metrics']
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile'
    ports:
      - '${EXPORTER_BIND:-127.0.0.1}:9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
      - backup-metrics:/textfile:ro
    networks:
      - monitoring
    logging: *default-logging

  # Staging-only metrics UI/backend. Retention 30d.
  # docker compose --profile observability up -d prometheus grafana
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['observability']
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/prometheus/docker-entrypoint.sh']
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      PRODUCTION_METRICS_BEARER_TOKEN: ${PRODUCTION_METRICS_BEARER_TOKEN:-}
      PRODUCTION_TAILSCALE_HOST: ${PRODUCTION_TAILSCALE_HOST:-}
    volumes:
      - ./prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/docker-entrypoint.sh:/etc/prometheus/docker-entrypoint.sh:ro
      - prometheus-data:/prometheus
    ports:
      - '${MONITORING_BIND:-127.0.0.1}:9090:9090'
    networks:
      - monitoring
      - application
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Set a strong password on the VPS; smoke may use a local throwaway value.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-smoke-grafana-change-me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3001}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${MONITORING_BIND:-127.0.0.1}:3001:3000'
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_started
    logging: *default-logging

  # Ship Docker JSON logs to Better Stack. Requires BETTERSTACK_SOURCE_TOKEN.
  # docker compose --profile logs up -d vector
  vector:
    image: timberio/vector:0.41.1-alpine
    profiles: ['logs']
    restart: unless-stopped
    environment:
      # Required for a working sink; empty token fails at runtime (not at compose parse).
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ['--config', '/etc/vector/vector.toml']
    networks:
      - monitoring
    logging: *default-logging

  # Isolated restore drill. Never points at live DATABASE_URL. M3.3.
  # docker compose --env-file ... --profile operations run --rm verify-restore
  verify-restore:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${BACKUP_IMAGE:-solocamiones-backup:local}
    profiles: ['operations']
    restart: 'no'
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      RESTORE_DENIED_DATABASE_URLS: ${RESTORE_DENIED_DATABASE_URLS:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_AGE_SECRET_KEY: ${BACKUP_AGE_SECRET_KEY:-}
      BACKUP_OBJECT_KEY: ${BACKUP_OBJECT_KEY:-}
      BACKUP_CHECKSUM_OBJECT_KEY: ${BACKUP_CHECKSUM_OBJECT_KEY:-}
    volumes:
      - ../../scripts/deployment/verify-restore.sh:/scripts/verify-restore.sh:ro
      - backup-tmp:/tmp/solocamiones-restore
    entrypoint: ['/bin/bash', '/scripts/verify-restore.sh']
    networks:
      - database
      - application
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # Daily retention purge (one batch of 100). Does not affect API readiness. M3.5.
  # docker compose --env-file ... --profile operations run --rm assistant-purge
  assistant-purge:
    image: ${API_IMAGE:-solocamiones-api:local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles: ['operations']
    restart: 'no'
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
    command: ['npm', 'run', 'assistant:purge:runtime', '-w', '@solocamiones/api']
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

networks:
  edge:
  application:
  database:
    internal: true
  monitoring:

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-solocamiones_pgdata}
  backup-tmp:
    name: ${BACKUP_TMP_VOLUME_NAME:-solocamiones_backup_tmp}
  backup-metrics:
    name: ${BACKUP_METRICS_VOLUME_NAME:-solocamiones_backup_metrics}
  prometheus-data:
    name: ${PROMETHEUS_VOLUME_NAME:-solocamiones_prometheus_data}
  grafana-data:
    name: ${GRAFANA_VOLUME_NAME:-solocamiones_grafana_data}
