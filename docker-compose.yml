services:
  db:
    image: postgres:16-alpine
    container_name: solocamiones_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    ports:
      - '${DATABASE_PORT}:5432'

    volumes:
      - solocamiones_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: solocamiones_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      # API is unpublished; nginx is the only client. Do not publish port 3000.
      TRUST_PROXY: ${TRUST_PROXY}
      # Host .env is not auto-injected. Without this, USD confirm/retry stays PENDING_FX_RATE.
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}

      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_VECTOR_STORE_ID: ${OPENAI_VECTOR_STORE_ID}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS}
      ASSISTANT_DAILY_MESSAGE_LIMIT: ${ASSISTANT_DAILY_MESSAGE_LIMIT}
      ASSISTANT_GLOBAL_DAILY_MESSAGE_LIMIT: ${ASSISTANT_GLOBAL_DAILY_MESSAGE_LIMIT}
      ASSISTANT_MAX_INPUT_CHARS: ${ASSISTANT_MAX_INPUT_CHARS}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS}
      ASSISTANT_MAX_TOOL_CALLS: ${ASSISTANT_MAX_TOOL_CALLS}
      ASSISTANT_MAX_RETRIEVAL_RESULTS: ${ASSISTANT_MAX_RETRIEVAL_RESULTS}
      ASSISTANT_RETRIEVAL_SCORE_THRESHOLD: ${ASSISTANT_RETRIEVAL_SCORE_THRESHOLD}
      ASSISTANT_REQUEST_TIMEOUT_MS: ${ASSISTANT_REQUEST_TIMEOUT_MS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ENABLE_DEMO_CONTROLS: ${VITE_ENABLE_DEMO_CONTROLS}
        VITE_CAPABILITIES_PRESET: ${VITE_CAPABILITIES_PRESET}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API}
    container_name: solocamiones_web
    restart: unless-stopped
    ports:
      - '${WEB_PORT}:8081'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8081/']
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: solocamiones_cloudflared
    restart: unless-stopped
    # Port 8080 lets nginx distinguish the trusted tunnel from the host-published local path.
    command: tunnel --no-autoupdate --protocol http2 --url http://web:8080/
    depends_on:
      web:
        condition: service_healthy

volumes:
  solocamiones_pgdata:
