# Local development / test Compose — not production.
# VPS staging/production uses infra/vps/compose.yaml.
#
# Default: db → migrate (one-shot) → api → web
# Optional: --profile test (db-test), --profile tunnel (cloudflared)

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  NODE_ENV: ${NODE_ENV:-development}
  PORT: ${PORT:-3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL_DOCKER}
  TRUST_PROXY: '1'
  INITIAL_PASSWORD: ${INITIAL_PASSWORD}
  EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
  ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
  ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_VECTOR_STORE_ID: ${OPENAI_VECTOR_STORE_ID:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
  ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
  ASSISTANT_DAILY_MESSAGE_LIMIT: ${ASSISTANT_DAILY_MESSAGE_LIMIT:-50}
  ASSISTANT_GLOBAL_DAILY_MESSAGE_LIMIT: ${ASSISTANT_GLOBAL_DAILY_MESSAGE_LIMIT:-100}
  ASSISTANT_MAX_INPUT_CHARS: ${ASSISTANT_MAX_INPUT_CHARS:-2000}
  ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-1200}
  ASSISTANT_MAX_TOOL_CALLS: ${ASSISTANT_MAX_TOOL_CALLS:-3}
  ASSISTANT_MAX_RETRIEVAL_RESULTS: ${ASSISTANT_MAX_RETRIEVAL_RESULTS:-6}
  ASSISTANT_RETRIEVAL_SCORE_THRESHOLD: ${ASSISTANT_RETRIEVAL_SCORE_THRESHOLD:-0.55}
  ASSISTANT_REQUEST_TIMEOUT_MS: ${ASSISTANT_REQUEST_TIMEOUT_MS:-45000}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - solocamiones_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Isolated Postgres for integration tests. Start with: docker compose --profile test up -d db-test
  db-test:
    image: postgres:16-alpine
    profiles: ['test']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_TEST_NAME:-truck_parts_test}
    ports:
      - '${DATABASE_TEST_PORT:-5434}:5432'
    volumes:
      - solocamiones_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_TEST_NAME:-truck_parts_test}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # One-shot schema apply. Does not restart. API waits for successful completion.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    environment:
      <<: *api-environment
    # Runtime image drops npm (Trivy). Use node --run against the workspace package.json.
    working_dir: /app/apps/api
    command: ['node', '--run', 'db:migrate:deploy:runtime']
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
    # API is unpublished; nginx (web) is the only client. Do not publish port 3000.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ENABLE_DEMO_CONTROLS: ${VITE_ENABLE_DEMO_CONTROLS:-false}
        VITE_CAPABILITIES_PRESET: ${VITE_CAPABILITIES_PRESET:-release-2}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    restart: unless-stopped
    ports:
      - '${WEB_PORT}:8081'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8081/']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    profiles: ['tunnel']
    restart: unless-stopped
    # Port 8080 lets nginx distinguish the trusted tunnel from the host-published local path.
    command: tunnel --no-autoupdate --protocol http2 --url http://web:8080/
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  solocamiones_pgdata:
  solocamiones_pgdata_test:
